<div class="login-container">
  <div class="login-card">

    <h1>Tienda</h1>
    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label for="usuario">Usuario</label>

        <input
          type="text"
          id="usuario"
          name="usuario"
          [(ngModel)]="usuario"
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <button type="submit">
        Iniciar sesión
      </button>

      @if (mensaje) {
        <p [class.error-message]="error" [class.success-message]="!error">
          {{ mensaje }}
        </p>
      }

    </form>

  </div>
</div>
